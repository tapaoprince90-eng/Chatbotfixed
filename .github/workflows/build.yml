          cat > src/main/java/com/example/aiplayer/AiPlayerMod.java <<'EOF'
          package com.example.aiplayer;

          import com.google.gson.JsonArray;
          import com.google.gson.JsonObject;
          import com.google.gson.JsonParser;
          import com.mojang.brigadier.arguments.StringArgumentType;
          import com.mojang.brigadier.builder.LiteralArgumentBuilder;
          import java.net.URI;
          import java.net.http.HttpClient;
          import java.net.http.HttpRequest;
          import java.net.http.HttpResponse;
          import java.time.Duration;
          import java.util.ArrayList;
          import java.util.HashMap;
          import java.util.List;
          import java.util.Locale;
          import java.util.Map;
          import java.util.Set;
          import java.util.UUID;
          import java.util.concurrent.ConcurrentHashMap;
          import java.util.function.Consumer;
          import java.util.regex.Matcher;
          import java.util.regex.Pattern;
          import net.fabricmc.api.ModInitializer;
          import net.fabricmc.fabric.api.command.v2.CommandRegistrationCallback;
          import net.fabricmc.fabric.api.event.lifecycle.v1.ServerLifecycleEvents;
          import net.fabricmc.fabric.api.message.v1.ServerMessageEvents;
          import net.fabricmc.fabric.api.object.builder.v1.entity.FabricDefaultAttributeRegistry;
          import net.minecraft.block.Block;
          import net.minecraft.entity.Entity;
          import net.minecraft.entity.EntityType;
          import net.minecraft.entity.SpawnGroup;
          import net.minecraft.registry.Registries;
          import net.minecraft.registry.Registry;
          import net.minecraft.server.MinecraftServer;
          import net.minecraft.server.command.CommandManager;
          import net.minecraft.server.command.ServerCommandSource;
          import net.minecraft.server.network.ServerPlayerEntity;
          import net.minecraft.server.world.ServerWorld;
          import net.minecraft.text.Text;
          import net.minecraft.util.Identifier;
          import net.minecraft.util.math.Direction;

          public class AiPlayerMod implements ModInitializer {
              public static final EntityType<AiBotEntity> BOT = Registry.register(
                  Registries.ENTITY_TYPE,
                  Identifier.of("aiplayer", "ai_bot"),
                  EntityType.Builder.create(AiBotEntity::new, SpawnGroup.MISC)
                      .dimensions(0.6f, 1.8f)
                      .maxTrackingRange(10)
                      .build("ai_bot"));

              static final String ACTIONS = " ACTIONS: you control a real body in the world. When the player asks you to do something, "
                  + "write a short reply and put exactly ONE action tag at the very end of your message. Tags: "
                  + "[BUILD shape material size] - shapes: house, tower, wall, bridge, platform, pyramid. "
                  + "material is a Minecraft block id like oak_planks, stone_bricks, cobblestone, glass, sandstone (optional). "
                  + "size is a number (optional): house width (default 7), tower height, wall or bridge length, platform or pyramid width. "
                  + "Example: [BUILD house stone_bricks 9]. "
                  + "[FIND thing] - thing is a Minecraft block id with underscores like diamond_ore, iron_ore, oak_log, chest, or the word apple. "
                  + "Example: [FIND diamond_ore]. "
                  + "[COME] - go to the player. [STOP] - stop what you are doing. [UNDO] - remove your last build. "
                  + "Only use a tag when the player really asks for that action. Never explain the tags. "
                  + "If asked to build something that is not one of the shapes, say you can only build those shapes.";
              static final Pattern TAG = Pattern.compile("\\[\\s*(BUILD|FIND|COME|STOP|UNDO)\\b([^\\]]*)\\]", Pattern.CASE_INSENSITIVE);

              static AiConfig config;
              static UUID botId;
              static final HttpClient HTTP = HttpClient.newHttpClient();
              static final Map<UUID, ArrayList<String[]>> history = new HashMap<>();
              static final Set<UUID> busy = ConcurrentHashMap.newKeySet();

              @Override
              public void onInitialize() {
                  config = AiConfig.load();
                  FabricDefaultAttributeRegistry.register(BOT, AiBotEntity.createAttributes());

                  ServerLifecycleEvents.SERVER_STOPPED.register(server -> {
                      Builds.clear();
                      botId = null;
                  });

                  CommandRegistrationCallback.EVENT.register((dispatcher, registryAccess, environment) -> {
                      dispatcher.register(CommandManager.literal("ai")
                          .then(setter("key", v -> config.apiKey = v))
                          .then(setter("model", v -> config.model = v))
                          .then(setter("url", v -> config.apiUrl = v))
                          .then(setter("name", v -> config.name = v))
                          .then(setter("personality", v -> config.personality = v))
                          .then(CommandManager.literal("talk")
                              .requires(s -> s.hasPermissionLevel(2))
                              .then(CommandManager.literal("on").executes(ctx -> {
                                  config.talk = true;
                                  config.save();
                                  ctx.getSource().sendFeedback(() -> Text.literal("AI now answers every chat message"), false);
                                  return 1;
                              }))
                              .then(CommandManager.literal("off").executes(ctx -> {
                                  config.talk = false;
                                  config.save();
                                  ctx.getSource().sendFeedback(() -> Text.literal("AI now only answers /ai messages"), false);
                                  return 1;
                              })))
                          .then(CommandManager.literal("spawn").executes(ctx -> {
                              ServerPlayerEntity p = ctx.getSource().getPlayerOrThrow();
                              ServerWorld w = p.getServerWorld();
                              removeBots(ctx.getSource().getServer(), w, p);
                              AiBotEntity bot = BOT.create(w);
                              if (bot == null) return 0;
                              bot.refreshPositionAndAngles(p.getX() + 1.5, p.getY(), p.getZ() + 1.5, p.getYaw() + 180.0f, 0.0f);
                              bot.setCustomName(Text.literal(config.name));
                              bot.setCustomNameVisible(true);
                              bot.setPersistent();
                              w.spawnEntity(bot);
                              botId = bot.getUuid();
                              ctx.getSource().sendFeedback(() -> Text.literal(config.name + " joined. Just chat with it."), false);
                              return 1;
                          }))
                          .then(CommandManager.literal("remove").executes(ctx -> {
                              ServerPlayerEntity p = ctx.getSource().getPlayerOrThrow();
                              removeBots(ctx.getSource().getServer(), p.getServerWorld(), p);
                              ctx.getSource().sendFeedback(() -> Text.literal("AI body removed"), false);
                              return 1;
                          }))
                          .then(CommandManager.literal("stop").executes(ctx -> {
                              ServerPlayerEntity p = ctx.getSource().getPlayerOrThrow();
                              AiBotEntity b = findBot(p);
                              if (b != null) b.stopJob();
                              ctx.getSource().sendFeedback(() -> Text.literal("Stopped"), false);
                              return 1;
                          }))
                          .then(CommandManager.literal("undo").executes(ctx -> {
                              ServerPlayerEntity p = ctx.getSource().getPlayerOrThrow();
                              AiBotEntity b = findBot(p);
                              if (b != null) b.stopJob();
                              int n = Builds.undoLast();
                              ctx.getSource().sendFeedback(() -> Text.literal("Restored " + n + " blocks"), false);
                              return 1;
                          }))
                          .then(CommandManager.literal("clear").executes(ctx -> {
                              ServerPlayerEntity p = ctx.getSource().getPlayerOrThrow();
                              history.remove(p.getUuid());
                              ctx.getSource().sendFeedback(() -> Text.literal("AI memory cleared"), false);
                              return 1;
                          }))
                          .then(CommandManager.literal("status").executes(ctx -> {
                              String s = "Name: " + config.name + " | Model: " + config.model
                                  + " | Key: " + (config.apiKey.isBlank() ? "NOT SET" : "set")
                                  + " | Talk: " + (config.talk ? "every message" : "/ai only")
                                  + " | URL: " + config.apiUrl;
                              ctx.getSource().sendFeedback(() -> Text.literal(s), false);
                              return 1;
                          }))
                          .then(CommandManager.argument("message", StringArgumentType.greedyString()).executes(ctx -> {
                              ServerPlayerEntity p = ctx.getSource().getPlayerOrThrow();
                              String m = StringArgumentType.getString(ctx, "message").trim();
                              MinecraftServer server = p.getServer();
                              if (server != null) {
                                  server.getPlayerManager().broadcast(
                                      Text.literal("<" + p.getName().getString() + "> " + m), false);
                              }
                              ask(p, m);
                              return 1;
                          })));
                  });

                  ServerMessageEvents.CHAT_MESSAGE.register((message, sender, params) -> {
                      if (!config.talk) return;
                      String t = message.getContent().getString().trim();
                      if (t.isEmpty()) return;
                      ask(sender, t);
                  });
              }

              // ---------- bot helpers ----------
              static void removeBots(MinecraftServer server, ServerWorld here, ServerPlayerEntity p) {
                  if (botId != null) {
                      for (ServerWorld w : server.getWorlds()) {
                          Entity e = w.getEntity(botId);
                          if (e != null) e.discard();
                      }
                  }
                  for (AiBotEntity b : here.getEntitiesByClass(AiBotEntity.class, p.getBoundingBox().expand(200), e -> true)) {
                      b.discard();
                  }
                  botId = null;
              }

              static AiBotEntity findBot(ServerPlayerEntity p) {
                  MinecraftServer server = p.getServer();
                  if (server != null && botId != null) {
                      for (ServerWorld w : server.getWorlds()) {
                          Entity e = w.getEntity(botId);
                          if (e instanceof AiBotEntity b) return b;
                      }
                  }
                  List<AiBotEntity> near = p.getServerWorld().getEntitiesByClass(
                      AiBotEntity.class, p.getBoundingBox().expand(200), e -> true);
                  if (!near.isEmpty()) {
                      botId = near.get(0).getUuid();
                      return near.get(0);
                  }
                  return null;
              }

              static void callBot(AiBotEntity bot, ServerPlayerEntity p) {
                  if (bot.getWorld() == p.getServerWorld() && bot.squaredDistanceTo(p) > 400.0) {
                      bot.refreshPositionAndAngles(p.getX() + 1.0, p.getY(), p.getZ() + 1.0, bot.getYaw(), bot.getPitch());
                      bot.getNavigation().stop();
                  }
              }

              static LiteralArgumentBuilder<ServerCommandSource> setter(String lit, Consumer<String> f) {
                  return CommandManager.literal(lit)
                      .requires(s -> s.hasPermissionLevel(2))
                      .then(CommandManager.argument("value", StringArgumentType.greedyString()).executes(ctx -> {
                          f.accept(StringArgumentType.getString(ctx, "value").trim());
                          config.save();
                          ctx.getSource().sendFeedback(() -> Text.literal("Saved: " + lit), false);
                          return 1;
                      }));
              }

              static void say(MinecraftServer server, String text) {
                  String t = text.length() > 600 ? text.substring(0, 600) : text;
                  for (String line : t.split("\n")) {
                      if (line.isBlank()) continue;
                      server.getPlayerManager().broadcast(Text.literal("<" + config.name + "> " + line.trim()), false);
                  }
              }

              // ---------- actions ----------
              static String clean(String raw) {
                  return TAG.matcher(raw).replaceAll("").trim();
              }

              static void act(ServerPlayerEntity p, MinecraftServer server, String raw) {
                  Matcher m = TAG.matcher(raw);
                  if (!m.find()) return;
                  String cmd = m.group(1).toUpperCase(Locale.ROOT);
                  String args = m.group(2).trim();
                  AiBotEntity bot = findBot(p);

                  if (cmd.equals("UNDO")) {
                      if (bot != null) bot.stopJob();
                      say(server, "Removed my last build (" + Builds.undoLast() + " blocks restored).");
                      return;
                  }
                  if (bot == null) {
                      say(server, "I need my body for that. Type /ai spawn first.");
                      return;
                  }
                  switch (cmd) {
                      case "STOP":
                          bot.stopJob();
                          break;
                      case "COME":
                          bot.stopJob();
                          if (bot.getWorld() == p.getServerWorld() && bot.squaredDistanceTo(p) > 36.0) {
                              bot.refreshPositionAndAngles(p.getX() + 1.0, p.getY(), p.getZ() + 1.0, bot.getYaw(), bot.getPitch());
                          }
                          break;
                      case "FIND":
                          if (args.isEmpty()) {
                              say(server, "Find what?");
                              return;
                          }
                          callBot(bot, p);
                          if (!bot.startFind(args)) say(server, "I don't know what \"" + args + "\" is.");
                          break;
                      case "BUILD": {
                          String[] t = args.isEmpty() ? new String[0] : args.split("\\s+");
                          if (t.length == 0) {
                              say(server, "Build what? I can do: house, tower, wall, bridge, platform, pyramid.");
                              return;
                          }
                          String shape = Builds.shapeName(t[0]);
                          if (shape == null) {
                              say(server, "I can only build: house, tower, wall, bridge, platform, pyramid.");
                              return;
                          }
                          int size = 0;
                          String mat = null;
                          for (int i = 1; i < t.length; i++) {
                              try {
                                  size = Integer.parseInt(t[i]);
                              } catch (NumberFormatException e) {
                                  mat = mat == null ? t[i] : mat + "_" + t[i];
                              }
                          }
                          Block def = Builds.defaultMaterial(shape);
                          Block b = Builds.material(mat, def);
                          if (b == null) {
                              say(server, "I can't use that block, so I'll use " + def.getName().getString() + ".");
                              b = def;
                          }
                          Direction d = p.getHorizontalFacing();
                          List<Builds.Step> steps = Builds.generate(shape, b, size, p.getBlockPos(), d.getOffsetX(), d.getOffsetZ());
                          if (steps.isEmpty()) {
                              say(server, "I couldn't plan that build.");
                              return;
                          }
                          callBot(bot, p);
                          bot.startBuild(steps);
                          break;
                      }
                      default:
                          break;
                  }
              }

              // ---------- AI ----------
              static void ask(ServerPlayerEntity p, String text) {
                  MinecraftServer server = p.getServer();
                  if (server == null) return;
                  if (config.apiKey == null || config.apiKey.isBlank()) {
                      say(server, "I have no API key yet. An op must type: /ai key YOUR_KEY");
                      return;
                  }
                  UUID id = p.getUuid();
                  if (!busy.add(id)) {
                      say(server, "Wait, I'm still thinking...");
                      return;
                  }

                  ArrayList<String[]> h = history.computeIfAbsent(id, k -> new ArrayList<>());
                  h.add(new String[]{"user", text});
                  while (h.size() > 12) h.remove(0);

                  AiBotEntity bot = findBot(p);
                  String bodyInfo = bot == null
                      ? " You have no body yet; if the player wants you to build or find things, tell them to type /ai spawn."
                      : " Your body is at " + bot.getBlockPos().getX() + " " + bot.getBlockPos().getY() + " " + bot.getBlockPos().getZ()
                          + (bot.isBuilding() ? " and you are busy building." : bot.isFinding() ? " and you are busy searching." : ".");
                  String ctxInfo = " The player talking to you is " + p.getName().getString()
                      + ", at " + p.getBlockPos().getX() + " " + p.getBlockPos().getY() + " " + p.getBlockPos().getZ()
                      + " in " + p.getServerWorld().getRegistryKey().getValue()
                      + ", health " + Math.round(p.getHealth()) + "/20." + bodyInfo;

                  JsonArray msgs = new JsonArray();
                  JsonObject sys = new JsonObject();
                  sys.addProperty("role", "system");
                  sys.addProperty("content", config.personality + ACTIONS + ctxInfo);
                  msgs.add(sys);
                  for (String[] m : h) {
                      JsonObject o = new JsonObject();
                      o.addProperty("role", m[0]);
                      o.addProperty("content", m[1]);
                      msgs.add(o);
                  }
                  JsonObject body = new JsonObject();
                  body.addProperty("model", config.model);
                  body.add("messages", msgs);
                  body.addProperty("max_tokens", 800);

                  HttpRequest req;
                  try {
                      req = HttpRequest.newBuilder(URI.create(config.apiUrl))
                          .header("Content-Type", "application/json")
                          .header("Authorization", "Bearer " + config.apiKey)
                          .timeout(Duration.ofSeconds(40))
                          .POST(HttpRequest.BodyPublishers.ofString(body.toString()))
                          .build();
                  } catch (RuntimeException e) {
                      busy.remove(id);
                      say(server, "The API url looks wrong. Use /ai url <link>");
                      return;
                  }

                  HTTP.sendAsync(req, HttpResponse.BodyHandlers.ofString()).whenComplete((resp, err) -> {
                      String[] r = result(resp, err);
                      server.execute(() -> {
                          busy.remove(id);
                          if (r[0].equals("1")) {
                              h.add(new String[]{"assistant", r[1]});
                              while (h.size() > 12) h.remove(0);
                              String shown = clean(r[1]);
                              if (shown.isEmpty()) shown = "Okay!";
                              say(server, shown);
                              try {
                                  act(p, server, r[1]);
                              } catch (RuntimeException ex) {
                                  say(server, "That action failed: " + ex.getClass().getSimpleName());
                              }
                          } else {
                              say(server, r[1]);
                          }
                      });
                  });
              }

              static String[] result(HttpResponse<String> resp, Throwable err) {
                  if (err != null) {
                      Throwable c = err.getCause() != null ? err.getCause() : err;
                      return new String[]{"0", "Could not reach the AI: " + c.getClass().getSimpleName() + " " + c.getMessage()};
                  }
                  String b = resp.body();
                  if (resp.statusCode() / 100 != 2) {
                      String shortBody = b.length() > 200 ? b.substring(0, 200) : b;
                      return new String[]{"0", "AI error " + resp.statusCode() + ": " + shortBody};
                  }
                  try {
                      JsonObject o = JsonParser.parseString(b).getAsJsonObject();
                      String text = o.getAsJsonArray("choices").get(0).getAsJsonObject()
                          .getAsJsonObject("message").get("content").getAsString().trim();
                      return new String[]{"1", text};
                  } catch (RuntimeException e) {
                      return new String[]{"0", "Could not read the AI answer."};
                  }
              }
          }
          EOF
